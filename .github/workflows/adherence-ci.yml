name: Hypothesis Lab CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  adherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Execute persisted adherence study
        shell: bash
        run: |
          export ATUAS_DB_PATH=/tmp/atuas-adherence.sqlite
          export ATUAS_STORAGE_PATH=/tmp/atuas-adherence-storage
          node apps/backend/dist/server.js > /tmp/atuas-adherence-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT

          READY=0
          for i in {1..20}; do
            if curl --fail --silent http://localhost:3001/api/health > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/atuas-adherence-api.log
            exit 1
          fi

          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -d '{"code":"CI-ADH","name":"Tábua Aderência CI","kind":"Mortalidade geral","sexScope":"UNISEX","source":"CI","version":"v1","points":[{"age":20,"sex":"UNISEX","qx":0.001},{"age":21,"sex":"UNISEX","qx":0.002},{"age":22,"sex":"UNISEX","qx":0.003}]}' \
            http://localhost:3001/api/biometric-tables/ \
            > /tmp/adh-table.json

          TABLE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/adh-table.json","utf8")).id')
          V1_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/adh-table.json","utf8")).versions[0].id')

          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -d "{\"parentVersionId\":\"$V1_ID\",\"version\":\"v2-90pct\",\"transform\":\"QX_SCALE\",\"factor\":0.9}" \
            http://localhost:3001/api/biometric-tables/$TABLE_ID/derive \
            > /tmp/adh-derived.json

          V2_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/adh-derived.json","utf8")).version.id')
          export V1_ID V2_ID

          node - <<'NODE' > /tmp/adh-study-request.json
          const v1 = process.env.V1_ID;
          const v2 = process.env.V2_ID;
          process.stdout.write(JSON.stringify({
            name: 'Mortalidade CI 2025',
            hypothesisType: 'Mortalidade geral',
            periodStart: 2025,
            periodEnd: 2025,
            sexScope: 'UNISEX',
            alpha: 0.05,
            fisherSplitAge: 21,
            candidateVersionIds: [v1, v2],
            observations: [
              { year: 2025, age: 20, sex: 'UNISEX', exposure: 1000, observedEvents: 1 },
              { year: 2025, age: 21, sex: 'UNISEX', exposure: 1000, observedEvents: 2 },
              { year: 2025, age: 22, sex: 'UNISEX', exposure: 1000, observedEvents: 3 }
            ]
          }));
          NODE

          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            --data-binary @/tmp/adh-study-request.json \
            http://localhost:3001/api/adherence-studies/ \
            > /tmp/adh-study.json

          node - <<'NODE'
          const fs = require('fs');
          const study = JSON.parse(fs.readFileSync('/tmp/adh-study.json', 'utf8'));
          if (study.status !== 'COMPLETED' || study.engineVersion !== 'atuas-adherence-v1') process.exit(1);
          if (study.candidates.length !== 2 || study.candidates[0].rank !== 1) process.exit(1);
          const winner = study.candidates[0];
          if (winner.biometricVersionId !== process.env.V1_ID) process.exit(1);
          if (Math.abs(winner.expectedEvents - 6) > 1e-10 || Math.abs(winner.dqm) > 1e-14) process.exit(1);
          if (!winner.chiSquarePass || !winner.ksPass || !winner.zPass || !winner.fisherPass) process.exit(1);
          fs.writeFileSync('/tmp/winner-id', winner.id);
          NODE

          WINNER_ID=$(cat /tmp/winner-id)
          curl --fail --silent --show-error \
            http://localhost:3001/api/adherence-candidates/$WINNER_ID/points \
            > /tmp/adh-points.json

          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/adh-points.json', 'utf8'));
          if (result.points.length !== 3) process.exit(1);
          if (Math.abs(result.points[0].expectedEvents - 1) > 1e-10) process.exit(1);
          if (Math.abs(result.points[2].residual) > 1e-10) process.exit(1);
          NODE
